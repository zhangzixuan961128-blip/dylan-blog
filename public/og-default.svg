<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="150" cy="120" r="180" fill="#818cf8" opacity="0.05"/>
  <circle cx="1050" cy="500" r="220" fill="#818cf8" opacity="0.04"/>
  <circle cx="900" cy="100" r="60" fill="#818cf8" opacity="0.06"/>
  <circle cx="300" cy="500" r="40" fill="#818cf8" opacity="0.05"/>
  <!-- Decorative lines -->
  <line x1="0" y1="540" x2="400" y2="540" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <line x1="800" y1="90" x2="1200" y2="90" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <!-- Text -->
  <text x="600" y="290" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">Dylan's Blog</text>
  <text x="600" y="345" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="0.5">AI Product Manager · Agent Security · AI Design</text>
  <!-- Accent bar -->
  <rect x="560" y="370" width="80" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
